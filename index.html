<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Order status</title>
<meta name="theme-color" content="#f97316">
<style>
  :root {
    --bg: #f6f6f7; --card: #ffffff; --text: #18181b; --muted: #71717a; --line: #e4e4e7;
    --orange: #f97316; --orange-soft: #fff7ed; --green: #10b981; --green-soft: #ecfdf5; --red: #ef4444;
    --mark: url(printboss-mono.png);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0c0e; --card: #18181b; --text: #f4f4f5; --muted: #a1a1aa; --line: #27272a; --orange-soft: #2a1608; --green-soft: #062a20; --mark: url(printboss-mono-dark.png); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  .shop { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .logo { width: 48px; height: 48px; border-radius: 14px; object-fit: cover; background: var(--orange); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 20px; flex: none; }
  .shop h1 { font-size: 18px; margin: 0; }
  .shop p { margin: 0; color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-bottom: 14px; }
  .hello { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
  .num { font-size: 22px; font-weight: 800; margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .rush { font-size: 11px; font-weight: 800; color: var(--red); border: 1px solid var(--red); border-radius: 999px; padding: 2px 8px; letter-spacing: .04em; }
  .big { margin: 14px 0 0; padding: 14px; border-radius: 14px; background: var(--orange-soft); font-weight: 700; }
  .big.done { background: var(--green-soft); }
  .big small { display: block; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .steps { display: flex; margin: 18px 0 4px; }
  .step { flex: 1; text-align: center; font-size: 12px; color: var(--muted); position: relative; }
  .step::before { content: ""; position: absolute; top: 13px; left: -50%; width: 100%; height: 3px; background: var(--line); z-index: 0; }
  .step:first-child::before { display: none; }
  .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--line); margin: 0 auto 6px; position: relative; z-index: 1; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; }
  .step.on { color: var(--text); font-weight: 700; }
  .step.on .dot, .step.on::before { background: var(--orange); }
  .step.ok .dot, .step.ok::before { background: var(--green); }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row span:first-child { color: var(--muted); }
  .row b { text-align: right; white-space: nowrap; }
  .item { padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .item .top { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
  .item .top b { white-space: nowrap; }
  .item .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .balance b { color: var(--orange); }
  .paid b { color: var(--green); }
  .actions { display: flex; gap: 10px; margin-bottom: 10px; }
  .btn { flex: 1; text-align: center; padding: 12px; border-radius: 14px; font-weight: 700; text-decoration: none; color: #fff; background: var(--orange); border: 0; font: inherit; font-weight: 700; cursor: pointer; }
  .btn.alt { background: #1877f2; }
  .btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .foot { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 26px; color: var(--muted); font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; }
  .foot i { width: 18px; height: 26px; background: var(--mark) center / contain no-repeat; }
  .msg { text-align: center; padding: 60px 10px; color: var(--muted); }
  .updated { text-align: center; color: var(--muted); font-size: 12px; }

  /* Invoice (always light, like a printed page) */
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; flex-direction: column; z-index: 10; }
  .sheet.open { display: flex; }
  .saved { position: fixed; inset: 0; background: rgba(0,0,0,.94); display: none; flex-direction: column; align-items: center; z-index: 20; padding: 16px; }
  .saved.open { display: flex; }
  .saved p { color: #fff; font-size: 14px; text-align: center; margin: 4px 0 12px; line-height: 1.4; }
  .saved img { max-width: 100%; max-height: calc(100vh - 170px); border-radius: 8px; background: #fff; -webkit-touch-callout: default; user-select: auto; }
  .saved .row { display: flex; gap: 10px; margin-top: 14px; width: 100%; max-width: 420px; }
  .saved .row .btn { flex: 1; }
  .sheet .scroll { flex: 1; overflow: auto; padding: 16px; }
  .sheet .bar { display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--card); }
  .inv { width: 100%; max-width: 440px; margin: 0 auto; background: #fff; color: #111; padding: 28px 24px; border-radius: 6px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .inv .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border-bottom: 2px solid #e5e7eb; padding-bottom: 14px; margin-bottom: 18px; }
  .inv .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .inv .brand img, .inv .brand .logo { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; flex: none; }
  .inv .brand h3 { margin: 0; font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: -.02em; line-height: 1.1; }
  .inv .brand p, .inv .label { margin: 3px 0 0; font-size: 10px; color: #6b7280; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .inv .jo { text-align: right; flex: none; }
  .inv .jo b { display: block; font-size: 17px; }
  .inv .jo span { font-size: 12px; color: #6b7280; }
  .inv .bill { background: #f9fafb; border: 1px solid #f3f4f6; border-radius: 10px; padding: 12px; margin-bottom: 16px; }
  .inv .bill b { display: block; font-size: 16px; margin-top: 2px; }
  .inv table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 14px; }
  .inv th { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #6b7280; text-align: left; border-bottom: 2px solid #e5e7eb; padding: 6px 0; }
  .inv td { padding: 8px 0; border-bottom: 1px solid #f3f4f6; vertical-align: top; }
  .inv td small { display: block; color: #6b7280; }
  .inv .r { text-align: right; } .inv .c { text-align: center; }
  .inv .totals { margin-left: auto; width: 62%; font-size: 13px; }
  .inv .totals div { display: flex; justify-content: space-between; padding: 3px 0; }
  .inv .totals .due { border-top: 2px solid #111; margin-top: 6px; padding-top: 8px; font-weight: 900; }
  .inv .totals .due b { font-size: 19px; }
  .inv .pills { display: flex; gap: 6px; margin: 16px 0; }
  .inv .pills span { font-size: 9px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: #4b5563; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 4px; padding: 4px 7px; }
  .inv .qr { display: flex; align-items: center; gap: 12px; border: 1px solid #e5e7eb; border-radius: 12px; padding: 10px; }
  .inv .qr img { width: 84px; height: 84px; flex: none; image-rendering: pixelated; }
  .inv .qr b { display: block; font-size: 14px; }
  .inv .qr small { color: #6b7280; font-size: 11px; }
  .inv .pb { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 22px; color: #6b7280; font-size: 12px; font-weight: 900; letter-spacing: .2em; text-transform: uppercase; }
  .inv .pb img { height: 24px; width: auto; }
</style>
</head>
<body>
<main id="app"><p class="msg">Loading your order…</p></main>
<div class="saved" id="saved">
  <p id="savedHint">Press and hold the invoice, then choose <b>Save image</b> or <b>Download image</b>.</p>
  <img id="savedImg" alt="Invoice">
  <div class="row">
    <button class="btn ghost" onclick="document.getElementById('saved').classList.remove('open')">Close</button>
    <a class="btn" id="savedDl" download>Download</a>
  </div>
</div>
<div class="sheet" id="sheet">
  <div class="scroll"><div class="inv" id="invoice"></div></div>
  <div class="bar">
    <button class="btn ghost" onclick="closeInvoice()">Close</button>
    <button class="btn" id="saveBtn" onclick="saveInvoice()">Save invoice</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const API = 'https://gxkvgkeprbqjsrmgfvmd.supabase.co/functions/v1/track-order';
const token = new URLSearchParams(location.search).get('t') || '';
const app = document.getElementById('app');
const peso = n => '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const day = d => d ? new Date(d).toLocaleDateString('en-PH', { weekday: 'short', month: 'long', day: 'numeric' }) : '';
const date = d => d ? new Date(d).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
let order = null;

function qrSrc(text) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createDataURL(6, 1);
}

function logoHtml(shop, cls) {
  const initial = (shop.name || 'P').trim().charAt(0).toUpperCase();
  return shop.logo_url ? `<img class="${cls}" src="${esc(shop.logo_url)}" crossorigin="anonymous" alt="">` : `<div class="logo">${esc(initial)}</div>`;
}

function render(o) {
  order = o;
  document.title = `${o.job_number} · ${o.shop?.name || 'Order status'}`;
  const delivery = /deliver/i.test(o.delivery_method || '');
  const step = o.status === 'Done' ? 3 : o.status === 'In Progress' ? 2 : 1;
  const big = step === 3
    ? `<div class="big done">✅ Ready for ${delivery ? 'delivery' : 'pickup'}!<small>${delivery ? 'Your order is on its way or ready to send.' : 'You can pick up your order at the shop.'}</small></div>`
    : step === 2
      ? `<div class="big">🖨️ Your order is being printed<small>${o.due_date ? 'Target date: ' + esc(day(o.due_date)) : 'We\'ll update this page when it\'s ready.'}</small></div>`
      : `<div class="big">📋 We received your order<small>${o.due_date ? 'Target date: ' + esc(day(o.due_date)) : 'It\'s in line for printing.'}</small></div>`;
  const s = (n, label) => `<div class="step ${step > n ? 'ok' : step === n ? 'on' : ''}"><div class="dot">${step > n ? '✓' : n}</div>${label}</div>`;
  const shop = o.shop || {};
  const messenger = shop.messenger ? `https://m.me/${encodeURIComponent(String(shop.messenger).replace(/^@/, '').replace(/^https?:\/\/(www\.)?(m\.me|facebook\.com)\//, ''))}` : '';
  const phone = String(shop.phone || '').replace(/[^\d+]/g, '');

  app.innerHTML = `
    <div class="shop">
      ${logoHtml(shop, 'logo')}
      <div><h1>${esc(shop.name || 'Print shop')}</h1><p>${esc([shop.address, shop.city].filter(Boolean).join(', '))}</p></div>
    </div>
    <div class="card">
      ${o.customer_first_name ? `<p class="hello">Hi ${esc(o.customer_first_name)}! Here's your order:</p>` : ''}
      <p class="num">${esc(o.job_number)} ${o.is_rush ? '<span class="rush">RUSH</span>' : ''}</p>
      ${big}
      <div class="steps">${s(1, 'Received')}${s(2, 'Printing')}${s(3, 'Ready')}</div>
    </div>
    ${o.items?.length ? `<div class="card"><h2>Items</h2>${o.items.map(i => `
      <div class="item">
        <div class="top"><span>${esc(i.name)}</span><b>${peso(i.amount)}</b></div>
        <div class="sub">${esc(i.copies)} × ${peso(i.unit_price)}</div>
      </div>`).join('')}</div>` : ''}
    <div class="card">
      <h2>Payment</h2>
      ${o.discount ? `<div class="row"><span>Discount${o.discount.reason ? ` (${esc(o.discount.reason)})` : ''}</span><b>−${peso(o.discount.amount)}</b></div>` : ''}
      <div class="row"><span>Total</span><b>${peso(o.total)}</b></div>
      <div class="row"><span>Paid${o.payment_method ? ` (${esc(o.payment_method)})` : ''}</span><b>${peso(o.paid)}</b></div>
      <div class="row ${o.balance > 0 ? 'balance' : 'paid'}"><span>${o.balance > 0 ? 'Balance' : 'Fully paid'}</span><b>${o.balance > 0 ? peso(o.balance) : '✓'}</b></div>
    </div>
    <div class="actions"><button class="btn ghost" onclick="openInvoice()">🧾 View / save invoice</button></div>
    ${phone || messenger ? `<div class="actions">${phone ? `<a class="btn" href="tel:${esc(phone)}">📞 Call shop</a>` : ''}${messenger ? `<a class="btn alt" href="${esc(messenger)}">💬 Message</a>` : ''}</div>` : ''}
    <p class="updated">Updated ${new Date().toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' })} · refreshes automatically</p>
    <a class="foot" href="https://printboss.pro"><i></i>Powered by PrintBoss</a>`;
}

function invoiceHtml(o) {
  const shop = o.shop || {};
  const rows = (o.items || []).map(i => `<tr><td>${esc(i.name)}<small>@ ${peso(i.unit_price)} each</small></td><td class="c">${esc(i.copies)}</td><td class="r">${peso(i.amount)}</td></tr>`).join('')
    || '<tr><td colspan="3" class="c"><small>No items listed.</small></td></tr>';
  return `
    <div class="head">
      <div class="brand">${logoHtml(shop, '')}<div><h3>${esc(shop.name || 'Print shop')}</h3><p>Official invoice</p></div></div>
      <div class="jo"><b>${esc(o.job_number)}</b><span>${esc(date(o.created_at))}</span></div>
    </div>
    ${o.customer_first_name ? `<div class="bill"><div class="label">Bill to</div><b>${esc(o.customer_first_name)}</b></div>` : ''}
    <table><thead><tr><th>Item</th><th class="c">Qty</th><th class="r">Total</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="totals">
      <div><span>Subtotal</span><span>${peso(o.total + (o.discount ? o.discount.amount : 0))}</span></div>
      ${o.is_rush ? '<div style="color:#ef4444"><span>Rush surcharge</span><span>Included</span></div>' : ''}
      ${o.discount ? `<div style="color:#059669"><span>Discount${o.discount.reason ? ` (${esc(o.discount.reason)})` : ''}</span><span>−${peso(o.discount.amount)}</span></div>
      <div><span>Total</span><span>${peso(o.total)}</span></div>` : ''}
      <div><span>Amount paid</span><span>${peso(o.paid)}</span></div>
      <div class="due"><span>Balance due</span><b>${peso(o.balance)}</b></div>
    </div>
    <div class="pills"><span>${esc(o.payment_status || '')}</span><span>${esc(o.delivery_method || '')}</span></div>
    <div class="qr"><img src="${qrSrc(location.href)}" alt=""><div><b>Scan to track your order</b><small>See if it's printing or ready for ${/deliver/i.test(o.delivery_method || '') ? 'delivery' : 'pickup'}, and your balance, anytime.</small></div></div>
    <div class="pb"><img src="printboss-mono.png" alt="">Powered by PrintBoss</div>`;
}

function openInvoice() {
  if (!order) return;
  document.getElementById('invoice').innerHTML = invoiceHtml(order);
  document.getElementById('sheet').classList.add('open');
}
function closeInvoice() { document.getElementById('sheet').classList.remove('open'); }
// Messenger / Facebook / Instagram in-app browsers block downloads; there the image is shown to press and hold.
const IN_APP = /FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|MicroMessenger/i.test(navigator.userAgent);
let savedUrl = null;

async function saveInvoice() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const canvas = await html2canvas(document.getElementById('invoice'), { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
    const blob = await new Promise((resolve, reject) => canvas.toBlob(b => (b ? resolve(b) : reject(new Error('empty'))), 'image/png'));
    const name = `${(order.shop?.name || 'Shop').replace(/[^\w]+/g, '_')}_Invoice_${order.job_number}.png`;
    const file = new File([blob], name, { type: 'image/png' });

    // 1. Phones: the share sheet (Save image, Gallery, Messenger...)
    if (!IN_APP && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: `Invoice ${order.job_number}` }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }

    if (savedUrl) URL.revokeObjectURL(savedUrl);
    savedUrl = URL.createObjectURL(blob);
    // 2. Computers: a normal download
    if (!IN_APP && !/Android|iPhone|iPad/i.test(navigator.userAgent)) {
      const a = document.createElement('a');
      a.download = name; a.href = savedUrl;
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    // 3. Everywhere else: show the image to press and hold (data URL so the long-press menu can save it)
    const img = document.getElementById('savedImg');
    img.src = canvas.toDataURL('image/png');
    const dl = document.getElementById('savedDl');
    dl.href = savedUrl; dl.download = name;
    dl.style.display = IN_APP ? 'none' : '';
    document.getElementById('savedHint').innerHTML = IN_APP
      ? 'Press and hold the invoice, then choose <b>Save image</b>. Or open this page in Chrome or Safari to download it.'
      : 'Press and hold the invoice, then choose <b>Save image</b> or <b>Download image</b>.';
    document.getElementById('saved').classList.add('open');
  } catch (err) {
    console.error(err);
    alert('Couldn\'t save the invoice. You can take a screenshot instead.');
  } finally {
    btn.disabled = false; btn.textContent = 'Save invoice';
  }
}

async function load() {
  if (!token) { app.innerHTML = '<p class="msg">This link is incomplete. Please ask the shop to send it again.</p>'; return; }
  try {
    const res = await fetch(`${API}?t=${encodeURIComponent(token)}`, { cache: 'no-store' });
    const data = await res.json();
    if (!res.ok) { app.innerHTML = `<p class="msg">${esc(data.error || 'We couldn\'t find this order.')}</p>`; return; }
    render(data);
  } catch {
    if (!app.querySelector('.card')) app.innerHTML = '<p class="msg">Can\'t load your order right now. Please check your connection and try again.</p>';
  }
}
load();
setInterval(() => { if (!document.getElementById('sheet').classList.contains('open')) load(); }, 60000);
</script>
</body>
</html>
